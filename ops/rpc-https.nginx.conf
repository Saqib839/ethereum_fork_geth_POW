server {
    listen 80;
    listen [::]:80;
    server_name rpc.markettrackerx.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        return 301 https://rpc.markettrackerx.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name rpc.markettrackerx.com;

    ssl_certificate /etc/letsencrypt/live/rpc.markettrackerx.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rpc.markettrackerx.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 2m;

    location = /healthz {
        proxy_pass http://127.0.0.1:8546/healthz;
        proxy_connect_timeout 1s;
        proxy_read_timeout 5s;
    }

    location / {
        proxy_pass http://127.0.0.1:8545;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;
        proxy_send_timeout 60s;
    }
}
